date: Jul 2026
title: VertiKV accepted to ACM MM 2026 (Oral)
titleZh: VertiKV 被 ACM MM 2026 接收（Oral）
type: Paper
typeZh: 论文
desc: >-
  VertiKV preserves vertical token-refinement paths during structured KV-cache
  compression, delivering 1.2–1.9× decoding speedup and an 80–95% reduction in
  KV-cache memory while maintaining multimodal long-context performance.
  Selected for an Oral presentation.
descZh: VertiKV 在结构化 KV 缓存压缩中保持 token 跨层垂直精炼路径，在维持多模态长上下文任务性能的同时，实现 1.2–1.9 倍解码加速与 80–95% 的 KV 缓存内存缩减，并入选 Oral 论文。
