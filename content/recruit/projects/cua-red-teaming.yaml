tasks:
  - Design attack scenarios across browsers, desktop apps, and documents
  - Implement an attacker agent that generates and mutates adversarial environments
  - Run large-scale evaluations on open and commercial CUAs
tasksZh:
  - 设计覆盖浏览器、桌面应用和文档的攻击场景
  - 实现能生成并变异对抗环境的攻击智能体
  - 在开源与商用 CUA 上开展大规模评测
requirements:
