title: Red-Teaming Computer-Using Agents
titleZh: 计算机使用智能体的红队测试
summary: >-
  Build an automated red-teaming pipeline that discovers how computer-using agents can be tricked by
  malicious web pages, pop-ups, and documents — then turn the findings into a public benchmark.
summaryZh: >-
  构建自动化红队测试流程，挖掘计算机使用智能体（CUA）会如何被恶意网页、弹窗和文档诱导，并将结果整理成公开基准。
