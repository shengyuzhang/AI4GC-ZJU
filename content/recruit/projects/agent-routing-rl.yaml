title: Learning to Route Across Agents with RL
titleZh: 基于强化学习的智能体路由
summary: >-
  Given a pool of LLMs and agents with different costs and skills, learn a router that picks the
  right one for each step — and keeps improving from its own mistakes.
summaryZh: >-
  面对能力和成本各不相同的一组 LLM 与智能体，学习一个路由器，为每一步挑选最合适的执行者，并从自己的错误中持续改进。
